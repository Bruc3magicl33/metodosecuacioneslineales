<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenador de gráficas lineales</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8efff;background:#0b1222}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:clamp(24px,4vw,38px);margin:0 0 8px}p{line-height:1.55}.muted{color:#9daecc}.layout{display:grid;grid-template-columns:minmax(310px,1fr) minmax(320px,1.1fr);gap:18px}.card{background:#141e32;border:1px solid #2b3b59;border-radius:18px;padding:20px;margin-bottom:16px}.step{border-top:1px solid #2c3a55;padding-top:15px;margin-top:15px}.step.locked{opacity:.48;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.substep{border-top:1px solid #2c3a55;padding:12px 0}.substep.locked{opacity:.45;pointer-events:none}.eqinput{max-width:270px;width:100%;flex:1}.field{display:flex;align-items:center;gap:7px;margin:8px 0}input,select,button{font:inherit;border-radius:10px}input,select{background:#0b1528;border:1px solid #526684;color:#fff;padding:10px;max-width:130px}select{max-width:unset}button{border:0;background:#4e8cff;color:white;padding:11px 15px;font-weight:700;cursor:pointer}button.secondary{background:#2d3f60}button:disabled{opacity:.4;cursor:not-allowed}.eq{font-size:clamp(24px,3vw,32px);font-weight:750;letter-spacing:.3px;color:#f9db8e;margin:14px 0}.msg{font-size:14px;margin-top:10px;color:#b8c9e9;min-height:24px}.ok{color:#7ee6ac}.bad{color:#ffaeab}.hint{border-left:3px solid #eeb96a;padding:10px 12px;background:#22283b;margin-top:9px;border-radius:4px}.chartwrap{position:sticky;top:12px}canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:12px;touch-action:none;cursor:crosshair}.pointlist{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.chip{background:#273a56;padding:7px 10px;border-radius:8px}.small{font-size:13px}.success{background:#173c32;border:1px solid #368f70;border-radius:10px;padding:10px;margin-top:10px}label{font-weight:600}#graphHelp{margin-top:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.chartwrap{position:static}main{padding:14px}}
math-field{display:block;min-width:210px;max-width:310px;flex:1;background:#0b1528;color:#fff;border:1px solid #526684;border-radius:10px;padding:7px 10px;font-size:20px;--caret-color:#8db6ff;--selection-background-color:#30528c}math-field:focus-within{border-color:#75a4ff}math-field[disabled]{opacity:.55}</style><script defer src="https://unpkg.com/mathlive@0.109.0/mathlive.min.js"></script></head><body><main><h1>📈 Entrenador de gráficas lineales</h1><p class="muted">Resuelve paso a paso y coloca los puntos en el plano. La recta se dibuja únicamente cuando ambos puntos son correctos.</p><div class="row card"><label for="mode">Tipo de ecuación:</label><select id="mode"><option value="general">General: ax + by + c = 0</option><option value="slope">Pendiente-ordenada: y = mx + b</option></select><button id="new">↻ Nuevo ejercicio</button></div><div class="layout"><section><div class="card"><div class="small muted">ECUACIÓN DEL EJERCICIO</div><div id="equation" class="eq"></div><div id="steps"></div></div></section><section><div class="card chartwrap"><h2 style="margin-top:0">Plano cartesiano</h2><p class="muted small">Haz clic en las intersecciones de la cuadrícula. Los puntos pueden colocarse en cualquier orden.</p><canvas id="plot" width="720" height="720" aria-label="Plano cartesiano interactivo"></canvas><div id="pointlist" class="pointlist"></div><div class="row"><button class="secondary" id="undo">↶ Deshacer punto</button><button class="secondary" id="clear">Limpiar puntos</button></div><div id="graphHelp" class="msg"></div></div></section></div></main><script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('plot'),ctx=canvas.getContext('2d');
let ex,stage=0,attempts={},points=[],selected=[],finished=false,graphErrors=0;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a)||1;
const fmt=(n,d=1)=>{if(d<0){n=-n;d=-d}let g=gcd(Math.abs(n),d);n/=g;d/=g;return d===1?String(n):`${n}/${d}`};
const val=s=>{s=String(s).trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');if(!s)return NaN;let m=s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\/([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);if(m){let d=Number(m[2]);return d?Number(m[1])/d:NaN}return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN};
const near=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-7;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const signed=(n,letter,first=false)=>{if(n===0)return '';let sign=n<0?'-':first?'':'+';let v=Math.abs(n);return `${sign}${letter&&v===1?'':v}${letter}`};
function make(){let mode=$('mode').value;if(mode==='general'){let a,b,x,y;do{x=rnd(-6,6);y=rnd(-6,6)}while(x===0||y===0||x===y);do{a=rnd(-4,4);b=rnd(-4,4)}while(!a||!b||a*x+b*y===0);let c=-a*x; // Choose intercepts using exact relation: b*y = -c = a*x
let k=rnd(1,4),l=rnd(1,4);let sx=rnd(0,1)?1:-1,sy=rnd(0,1)?1:-1;x=sx*k;y=sy*l;let g=gcd(Math.abs(x),Math.abs(y));a=y/g*(rnd(0,1)?1:-1);b=a*x/y; // may be fractional, instead a=y, b=x for x and y intercepts
 a=y;b=x;c=-x*y;let common=gcd(gcd(Math.abs(a),Math.abs(b)),Math.abs(c));a/=common;b/=common;c/=common;
 ex={mode,a,b,c,p1:[0,-c/b],p2:[-c/a,0]};ex.label=`${signed(a,'x',true)}${signed(b,'y')}${signed(c,'')}=0`;
 }else{let q=rnd(1,3),p=rnd(-3,3),b=rnd(-4,4);if(p===0)q=1;let g=gcd(Math.abs(p),q);p/=g;q/=g;ex={mode,m:p/q,num:p,den:q,b,p1:[0,b],p2:[q,b+p],label:`y=${p===0?'':p/q===1?'x':p/q===-1?'-x':fmt(p,q)+'x'}${b===0?'':signed(b,'',p===0)}`};if(p===0)ex.label=`y=${b}`;}
 stage=0;attempts={};points=[];selected=[];finished=false;graphErrors=0;$('equation').textContent=ex.label;renderSteps();draw();}
function generalData(i){let first=i<5,coef=first?ex.b:ex.a,v=first?'y':'x',other=first?'x':'y',n=-ex.c;return {first,coef,v,other,n,answer:n/coef,idx:i%5}}
function mathText(raw){let s=String(raw||'').replace(/\\left/g,'').replace(/\\right/g,'').replace(/\\cdot|\\times/g,'*').replace(/\\div/g,'/').replace(/\\,/g,'').replace(/\\;/g,'').replace(/\\ /g,'').replace(/\\operatorname\{([^}]*)\}/g,'$1');for(let j=0;j<8;j++){let old=s;s=s.replace(/\\(?:dfrac|tfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');if(s===old)break}return s.replace(/\\mathrm\{([^{}]*)\}/g,'$1').replace(/\\text\{([^{}]*)\}/g,'$1').replace(/\{/g,'(').replace(/\}/g,')').replace(/−/g,'-').replace(/\\,/g,'').replace(/\\ /g,'').replace(/\\colon/g,':')}
function readMath(i){let el=$('v'+i);return mathText(el?.getValue?el.getValue('latex'):el?.value)}
function writeMath(i,value){let el=$('v'+i);if(el?.setValue)el.setValue(value);else el.value=value}
function coordinate(text){
 // MathLive entrega LaTeX; quitar delimitadores del par antes de analizar componentes.
 let t=mathText(text).replace(/\s/g,'').replace(/\\(?:lparen|rparen|lbrack|rbrack)/g,'').replace(/\\(?:mathopen|mathclose|mathpunct)\{([^{}]*)\}/g,'$1');
 // Admitir paréntesis normales, de tamaño automático y corchetes externos.
 if((t.startsWith('(')&&t.endsWith(')'))||(t.startsWith('[')&&t.endsWith(']')))t=t.slice(1,-1);
 // Separar solamente en coma/punto y coma a nivel superior, no dentro de fracciones.
 let depth=0,cut=-1;
 for(let k=0;k<t.length;k++){let ch=t[k];if(ch==='('||ch==='[')depth++;else if(ch===')'||ch===']')depth--;else if((ch===','||ch===';')&&depth===0){if(cut!==-1)return null;cut=k}if(depth<0)return null}
 if(depth!==0||cut<=0||cut>=t.length-1)return null;
 let x=exprEval(t.slice(0,cut),'x',0),y=exprEval(t.slice(cut+1),'x',0);
 return Number.isFinite(x)&&Number.isFinite(y)?[x,y]:null;
}
function exprEval(expr,variable,t){let e=expr.trim().replace(/−/g,'-').replace(/\s+/g,'').replace(/,/g,'.').replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**');if(!e||/[^0-9xy+*/().-]/.test(e)||e.includes('**'))return NaN;e=e.replace(/(\d|\))(?=[xy(])/g,'$1*').replace(/([xy])(?=\d|\()/g,'$1*').replace(/\)(?=\d)/g,')*');if(e.includes(variable==='x'?'y':'x'))return NaN;e=e.replaceAll(variable,`(${t})`);try{let v=Function('"use strict";return ('+e+')')();return Number.isFinite(v)?v:NaN}catch{return NaN}}
function eqParts(text){let p=text.replace(/−/g,'-').split('=');return p.length===2?p:null}
function equivalent(text,variable,target){let p=eqParts(text);if(!p)return false;let q=eqParts(target);return [-3,-1,0,2,5].every(t=>near(exprEval(p[0],variable,t)-exprEval(p[1],variable,t),exprEval(q[0],variable,t)-exprEval(q[1],variable,t)))}
function generalExpected(i){let d=generalData(i),{coef,v,other,n,idx}=d;let original=ex.label.slice(0,-2);if(idx===0)return original.replace(new RegExp(other,'g'),'(0)')+'=0';if(idx===1)return `${signed(coef,v,true)}=${n}`;if(idx===2)return `${v}=${n}/${coef}`;if(idx===3)return `${v}=${fmt(n,coef)}`;return d.first?`(0,${fmt(n,coef)})`:`(${fmt(n,coef)},0)`}
function noApply(i){let d=generalData(i);return d.idx===2&&Math.abs(d.coef)===1}
function generalValid(i,raw){let d=generalData(i),{coef,v,other,n,idx}=d;let text=raw.trim().replace(/−/g,'-').replace(/\s/g,'');if(!text)return false;if(idx===0){return !text.includes(other)&&text.includes('0')&&equivalent(text,v,generalExpected(i))}if(idx===1){let parts=eqParts(text);return !!parts&&parts[0].includes(v)&&!parts[1].includes(v)&&!parts[0].includes('/')&&near(exprEval(parts[0],v,0),0)&&near(exprEval(parts[0],v,1),coef)&&near(exprEval(parts[1],v,0),n)}if(idx===2){let parts=eqParts(text);return !!parts&&parts[0]===v&&parts[1].includes('/')&&near(exprEval(parts[1],v,0),n/coef)}if(idx===4){let p=coordinate(text);return !!p&&near(p[0],d.first?0:d.answer)&&near(p[1],d.first?d.answer:0)}let parts=eqParts(text);return !!parts&&parts[0]===v&&near(exprEval(parts[1],v,0),n/coef)}
function renderSteps(){let s=$('steps');if(ex.mode==='general'){
 let heads=['1. Encuentra la intersección con el eje Y','2. Encuentra la intersección con el eje X'];let labels=['Sustituir','Despejar','Simplificar','Valor final','Escribir coordenada'];let html='';for(let block=0;block<2;block++){let d=generalData(block*5);html+=`<div class="step ${block?'locked':''}" id="block${block}"><h3>${heads[block]}</h3><p class="muted small">${block?'Sustituye y = 0 para encontrar x.':'Sustituye x = 0 para encontrar y.'} Completa cada operación antes de continuar.</p>`;for(let k=0;k<5;k++){let i=block*5+k,na=noApply(i);html+=`<div class="substep ${i?'locked':''}" id="sub${i}"><div class="small"><b>${block+1}.${k+1}. ${labels[k]}</b></div><p class="muted small">${k===0?`Escribe la ecuación al sustituir ${d.other}=0.`:k===1?'Pasa el término independiente al otro lado.':k===2?'Escribe la división para aislar la incógnita.':k===3?'Escribe el valor numérico de la incógnita.':`Escribe el punto completo en orden (x,y). Recuerda que ${d.other}=0.`}</p><div class="row"><math-field id="v${i}" aria-label="Respuesta matemática del subpaso ${block+1}.${k+1}" virtual-keyboard-mode="onfocus"></math-field><button id="check${i}">Comprobar</button>${na?`<button class="secondary" id="skip${i}">No aplica</button>`:''}</div><div id="m${i}" class="msg"></div></div>`}html+='</div>'}html+='<div class="step locked" id="st2"><h3>3. Ubica los dos puntos</h3><p>Marca en el plano <b>(0, y)</b> y <b>(x, 0)</b>. La recta se mostrará cuando ambos sean correctos.</p><div id="m2" class="msg"></div></div>';s.innerHTML=html;for(let i=0;i<10;i++){$('check'+i).onclick=()=>check(i);$('v'+i).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(i)}});let skip=$('skip'+i);if(skip)skip.onclick=()=>{if(stage!==i)return;$('m'+i).innerHTML='<span class="ok">✓ No aplica: la incógnita ya tiene coeficiente ±1.</span>';advance()}};
 }else{s.innerHTML=`<div class="step" id="st0"><h3>1. Identifica la pendiente y la ordenada</h3><p class="muted small">La pendiente m es el número que multiplica a x. La ordenada b es el término independiente.</p><div class="row"><div class="field"><label>b =</label><input id="vb" inputmode="decimal" placeholder="Ordenada"></div><div class="field"><label>m =</label><input id="vm" inputmode="decimal" placeholder="Ej. -2/3"></div><button id="check0">Comprobar</button></div><div id="m0" class="msg"></div></div><div class="step locked" id="st1"><h3>2. Ubica b y aplica la pendiente</h3><p>Primero marca <b>(0, b)</b>. Luego usa la pendiente para localizar un segundo punto.</p><div id="m1" class="msg"></div></div>`;$('check0').onclick=()=>check(0);['vb','vm'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')check(0)}))}updateStages()}
function help(i,n){if(ex.mode==='general'){let d=generalData(i),{coef,v,other,idx}=d;if(idx===0)return n===1?`Reemplaza cada ${other} por 0 y conserva el resto de la ecuación.`:n===2?`El término que contiene ${other} se anula al multiplicar por cero.`:`La sustitución completa es ${generalExpected(i)}.`;if(idx===1)return n===1?'Pasa el término independiente al lado derecho cambiando su signo.':n===2?`Debe quedar el coeficiente de ${v} a la izquierda y el número a la derecha.`:`Obtienes ${generalExpected(i)}.`;if(idx===2)return n===1?`Divide entre ${coef} para aislar ${v}.`:n===2?'Escribe la división antes de reducir la fracción.':`Una forma correcta es ${generalExpected(i)}.`;if(idx===4)return n===1?'Escribe un par ordenado (x,y), separado por coma.':n===2?`La coordenada ${other} vale cero, porque la sustituiste al principio.`:`El punto correcto es ${generalExpected(i)}.`;return n===1?'Resuelve la división y expresa el valor final.':n===2?`Recuerda que ${v}=${d.n}/${coef}.`:`El valor es ${v}=${fmt(d.n,coef)}.`}let v=ex;return n===1?'En y = mx + b, m acompaña a x; b está solo.':n===2?`El número independiente es b=${v.b}. La pendiente es el coeficiente de x.`:`La pendiente es m=${fmt(v.num,v.den)} y la ordenada es b=${v.b}.`}
function advance(){stage++;updateStages();if(stage===(ex.mode==='general'?10:1))$('graphHelp').textContent='Ahora coloca los dos puntos en el plano cartesiano.'}
function check(i){if(i!==stage)return;let correct=ex.mode==='general'?generalValid(i,readMath(i)):near(val($('vb').value),ex.b)&&near(val($('vm').value),ex.m);let msg=$('m'+i);if(correct){msg.innerHTML='<span class="ok">✓ Correcto. ¡Buen trabajo!</span>';advance();return}attempts[i]=(attempts[i]||0)+1;let n=attempts[i];msg.innerHTML=`<span class="bad">✗ Revisa tu respuesta. Intento ${Math.min(n,3)} de 3.</span><div class="hint">💡 ${help(i,Math.min(n,3))}</div>`;if(n>=3){msg.innerHTML+=`<button class="secondary" id="reveal${i}">Mostrar solución y continuar</button>`;$('reveal'+i).onclick=()=>{if(ex.mode==='general')writeMath(i,generalExpected(i));else{$('vb').value=ex.b;$('vm').value=fmt(ex.num,ex.den)}msg.innerHTML='<span class="ok">Solución explicada. Continúa con el siguiente paso.</span>';advance()}}}
function updateStages(){if(ex.mode==='general'){for(let b=0;b<2;b++)$('block'+b).classList.toggle('locked',stage<b*5);for(let i=0;i<10;i++){$('sub'+i).classList.toggle('locked',i>stage);$('check'+i).disabled=i!==stage;$('v'+i).toggleAttribute('disabled',i>stage);let sk=$('skip'+i);if(sk)sk.disabled=i!==stage}$('st2').classList.toggle('locked',stage<10)}else{for(let i=0;i<2;i++)$('st'+i).classList.toggle('locked',i>stage);$('check0').disabled=stage!==0}draw()}
const unit=canvas.width/20,center=canvas.width/2;function xy(p){return [center+p[0]*unit,center-p[1]*unit]}
function draw(){ctx.clearRect(0,0,720,720);ctx.fillStyle='#fff';ctx.fillRect(0,0,720,720);for(let n=-10;n<=10;n++){ctx.beginPath();ctx.strokeStyle=n===0?'#28364a':'#e1e7ef';ctx.lineWidth=n===0?2.5:1;ctx.moveTo(center+n*unit,0);ctx.lineTo(center+n*unit,720);ctx.moveTo(0,center+n*unit);ctx.lineTo(720,center+n*unit);ctx.stroke();if(n!==0){ctx.fillStyle='#59667b';ctx.font='14px system-ui';ctx.fillText(n,center+n*unit-6,center+18);ctx.fillText(-n,center+6,center+n*unit+5)}}ctx.fillStyle='#28364a';ctx.font='bold 17px system-ui';ctx.fillText('x',696,center-9);ctx.fillText('y',center+9,18);
 if(finished){let a=ex.p1,b=ex.p2,dx=b[0]-a[0],dy=b[1]-a[1];ctx.beginPath();ctx.strokeStyle='#16a36b';ctx.lineWidth=4;ctx.moveTo(...xy([a[0]-dx*20,a[1]-dy*20]));ctx.lineTo(...xy([a[0]+dx*20,a[1]+dy*20]));ctx.stroke()}
 points.forEach((p,i)=>{let [x,y]=xy(p);ctx.beginPath();ctx.fillStyle=selected.includes(i)?'#16a36b':'#f08b33';ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#152a40';ctx.font='bold 16px system-ui';ctx.fillText(`(${p[0]}, ${p[1]})`,x+10,y-10)});$('pointlist').innerHTML=points.map((p,i)=>`<span class="chip">P${i+1}: (${p[0]}, ${p[1]})</span>`).join('')||'<span class="muted small">Aún no has marcado puntos.</span>'}
function graphHint(){if(ex.mode==='general')return `Pista: el primer punto está sobre el eje Y: (0, ${fmt(-ex.c,ex.b)}). El segundo está sobre el eje X: (${fmt(-ex.c,ex.a)}, 0).`;let {num,den,b}=ex;if(num===0)return `La pendiente es cero: desde (0, ${b}) avanza horizontalmente, sin subir ni bajar.`;return `Primero ubica b=${b} en (0, ${b}). Como m=${fmt(num,den)}, desde ahí avanza ${den} ${den===1?'unidad':'unidades'} a la derecha y ${num>0?'sube':'baja'} ${Math.abs(num)} ${Math.abs(num)===1?'unidad':'unidades'}.`}
function testGraph(){if(points.length!==2)return;let [p,q]=points;let on=(r)=>ex.mode==='general'?near(ex.a*r[0]+ex.b*r[1]+ex.c,0):near(r[1],ex.m*r[0]+ex.b);let ok=ex.mode==='general'?([p,q].some(r=>near(r[0],0)&&near(r[1],ex.p1[1]))&&[p,q].some(r=>near(r[1],0)&&near(r[0],ex.p2[0]))):([p,q].some(r=>near(r[0],0)&&near(r[1],ex.b))&&on(p)&&on(q)&&!(near(p[0],q[0])&&near(p[1],q[1])));
 if(ok){finished=true;selected=[0,1];$('graphHelp').innerHTML='<div class="success">✓ ¡Excelente! Los dos puntos son correctos. La recta está trazada.</div>';let m=$(ex.mode==='general'?'m2':'m1');m.innerHTML='<span class="ok">✓ Gráfica completada correctamente.</span>';draw()}else{graphErrors++;$('graphHelp').innerHTML=`<span class="bad">✗ Alguno de los puntos no es correcto. Revisa las coordenadas.</span>${graphErrors>=2?`<div class="hint">💡 ${graphHint()}</div>`:''}<p class="small">Usa «Deshacer punto» o «Limpiar puntos» para intentarlo de nuevo.</p>`;}}
canvas.addEventListener('click',e=>{if(finished)return;if(stage<(ex.mode==='general'?10:1)){$('graphHelp').textContent='Primero completa los pasos anteriores.';return}if(points.length>=2){$('graphHelp').textContent='Ya colocaste dos puntos. Deshaz uno para cambiarlo.';return}let rect=canvas.getBoundingClientRect();let x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;let px=Math.round((x-center)/unit),py=Math.round((center-y)/unit);if(Math.abs(px)>10||Math.abs(py)>10)return;points.push([px,py]);draw();testGraph()});
$('undo').onclick=()=>{if(finished)return;points.pop();$('graphHelp').textContent='Punto eliminado. Continúa.';draw()};$('clear').onclick=()=>{if(finished)return;points=[];$('graphHelp').textContent='Plano limpio. Inténtalo de nuevo.';draw()};$('new').onclick=make;$('mode').onchange=make;make();
</script></body></html>
